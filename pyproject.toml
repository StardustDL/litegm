[project]
# Runtime dependencies are supplied by the pixi (conda-forge) environment; only
# dev-only tooling is pulled from PyPI to avoid conda/PyPI file collisions.
authors = [{name = "StardustDL", email = "stardustdl@163.com"}]
dependencies = []
description = "OpenAI-compatible multimedia generation gateway for ComfyUI, with an admin console."
license = {text = "Apache-2.0"}
license-files = ["LICENSE"]
name = "litegm"
readme = "README.md"
requires-python = ">= 3.15"
version = "0.1.0"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "openai"]

[project.scripts]
litegm = "litegm.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/litegm"]

[tool.pixi.workspace]
channels = ["conda-forge"]
# linux-aarch64 is the platform for ARM64 container hosts (e.g. Apple Silicon
# or arm64 servers); it is locked alongside the two development platforms.
platforms = ["win-64", "linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = "3.15.*"
fastapi = "*"
uvicorn = "*"
httpx = "*"
pydantic = "*"
sqlalchemy = "*"
pyyaml = "*"
python-multipart = "*"
pillow = "*"
websockets = ">=17.3,<18"
# ffmpeg/ffprobe: video first-frame thumbnails and media probing in the admin
# console (``src/litegm/admin.py`` resolves them from PATH); also shipped in the
# container image so the runtime environment is complete.
ffmpeg = ">=9.0.2,<10"

[tool.pixi.feature.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
openai = "*"
nodejs = ">=22"

[tool.pixi.feature.web.dependencies]
nodejs = ">=22"

[tool.pixi.pypi-dependencies]
litegm = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
web = { features = ["web"], solve-group = "default" }

[tool.pixi.environments.dev]
features = ["dev"]
solve-group = "default"

[tool.pixi.environments.dev.dependencies]
websockets = ">=17.3,<18"
pytest = ">=9.1.1,<10"
pytest-asyncio = ">=1.4.0,<2"
openai = ">=3.37.0,<4"
nodejs = ">=22"
playwright = ">=1.64.1,<2"

[tool.pixi.tasks]
# Real deployments read their config from the git-ignored ``.config/`` directory;
# ``config/`` in the repository is a committed example.
serve = "litegm serve --config .config/litegm.yaml --base-dir ."
check = "litegm check --config .config/litegm.yaml --base-dir ."
test = "pytest -q"
test-unit = "pytest -q -m 'not integration'"
test-integration = "pytest -q -m integration"
web-install = { cmd = "npm --prefix web install", depends-on = [] }
web-build = { cmd = "npm --prefix web run build", depends-on = ["web-install"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a reachable ComfyUI backend"]
asyncio_mode = "auto"
# The ``tmpdir`` plugin re-creates its base directory on every run (rm_rf + mkdir),
# which can leave it unreadable under Windows ACL inheritance. Tests use the
# ``workdir`` fixture instead.
addopts = "-p no:cacheprovider -p no:tmpdir"
